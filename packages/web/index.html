<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applied before first paint so a saved dark preference never flashes light.
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
    <meta
      name="description"
      content="Diagnostics for OIDC, OAuth 2.0, SAML SSO, and SCIM integrations that say what was verified and what was only read."
    />
    <title>Identity Inspector</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23183fad'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='m19 19 6 6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

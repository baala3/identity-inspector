name = "identity-inspector"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# The web interface is served from the same Worker, so it reaches the proxy
# under /api on its own origin and no cross-origin request is ever made.
[assets]
directory = "../web/dist"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Only pages served from this origin may read proxy responses in a browser.
[vars]
ALLOW_ORIGIN = "https://identity-inspector.balashekhar.workers.dev"
